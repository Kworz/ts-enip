on:
  push:
    branches:
      - main

name: "🚀 Build package and publish to npm"

env:
  NODE_ENV: development

jobs:
  build:
    if: github.repository == 'kworz/ts-enip' # Disable action on forks
    name: 🧱 Build & release
    runs-on: ubuntu-latest

    # Trusted publishing: npm exchanges this workflow's OIDC identity for a
    # short-lived credential, so no publish token is stored anywhere.
    # `contents` and `pull-requests` are what changesets needs to open the
    # "Version Packages" pull request and tag the release — declaring a
    # `permissions` block drops every default, so they must be listed too.
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: 📚 Install Pnpm
        uses: pnpm/action-setup@v4

      - name: 📚 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # Trusted publishing needs npm >= 11.5.1 and misbehaves on older ones.
      # Node 24 currently ships 11.9.0, but pinning to latest keeps this off the
      # runner image's release cadence.
      - name: ⛏️ Upgrade npm
        run: npm install -g npm@latest

      - name: 📚 Install Node dependencies
        run: pnpm install

      - name: 🧱 Run build scripts on all packages
        run: pnpm run build

      # Publishing goes through npm, and only npm. pnpm cannot do the OIDC
      # exchange (pnpm/pnpm#9812 is still open), and `changeset publish` cannot
      # either: it detects pnpm from `packageManager` and appends the
      # pnpm-only `--git-checks` flag, then runs npm, which rejects it
      # (EUNKNOWNCONFIG). `npm publish` sidesteps both — this repository holds a
      # single package, so there is nothing for changesets to orchestrate at
      # publish time anyway.
      #
      # No NPM_TOKEN and no `registry-url` here, deliberately: either one puts a
      # token in npm's config — `registry-url` writes setup-node's placeholder
      # `XXXXX-XXXXX-XXXXX-XXXXX` — and a configured token takes precedence over
      # OIDC, which is how you land back on the OTP prompt a CI cannot answer.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm publish
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
